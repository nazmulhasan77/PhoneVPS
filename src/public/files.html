<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneVPS File Explorer &bull; Storage Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-card: rgba(18, 26, 42, 0.85);
            --border-color: rgba(99, 102, 241, 0.25);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Nav */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--bg-card);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 800;
        }

        .brand-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }

        /* Toolbar & Breadcrumbs */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .crumb-item {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: none;
        }
        .crumb-item:hover { text-decoration: underline; }
        .crumb-sep { color: var(--text-dim); }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
        }

        /* File List Table */
        .file-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(15, 23, 42, 0.9);
            padding: 14px 18px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .file-name-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .file-name-cell.dir { color: #38bdf8; }
        .file-name-cell.file { color: #f1f5f9; }
        .file-name-cell:hover { text-decoration: underline; }

        .file-icon { font-size: 1.25rem; }

        .file-size {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .file-time {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-icon {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-icon:hover { background: rgba(99, 102, 241, 0.3); }
        .btn-del:hover { background: rgba(239, 68, 68, 0.3); border-color: var(--danger); color: #fca5a5; }

        /* Upload progress & modal */
        #fileInput { display: none; }
        
        .upload-bar-container {
            display: none;
            padding: 12px 20px;
            background: rgba(99, 102, 241, 0.15);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            align-items: center;
            justify-content: space-between;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Nav -->
        <div class="nav-bar">
            <a href="/" class="brand">
                <span>📁 PhoneVPS File Explorer</span>
                <span class="brand-badge">Android Termux</span>
            </a>
            <a href="/" class="back-link">
                &larr; Back to VPS Dashboard
            </a>
        </div>

        <!-- Breadcrumbs & Toolbar -->
        <div class="toolbar">
            <div class="breadcrumbs" id="breadcrumbContainer">
                <span class="crumb-item" onclick="loadDir('')">🏠 Home</span>
            </div>
            <div class="actions">
                <button class="btn btn-secondary" onclick="createFolder()">➕ New Folder</button>
                <button class="btn" onclick="document.getElementById('fileInput').click()">⬆️ Upload to Phone</button>
                <input type="file" id="fileInput" multiple onchange="uploadSelectedFiles()">
            </div>
        </div>

        <!-- Upload Status Banner -->
        <div id="uploadBanner" class="upload-bar-container">
            <span id="uploadStatusText">Uploading files to phone...</span>
        </div>

        <!-- File Table Card -->
        <div class="file-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Size</th>
                        <th>Modified</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                    <tr>
                        <td colspan="4" class="empty-state">Loading phone storage contents...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentPath = '';

        async function loadDir(reqPath = '') {
            currentPath = reqPath;
            updateBreadcrumbs();
            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Loading...</td></tr>';

            try {
                const res = await fetch('/api/files/list?path=' + encodeURIComponent(reqPath));
                const data = await res.json();
                if (data.success) {
                    renderFiles(data.items);
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: #ef4444;">Error: ${data.error}</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: #ef4444;">Network Error: ${err.message}</td></tr>`;
            }
        }

        function updateBreadcrumbs() {
            const container = document.getElementById('breadcrumbContainer');
            let html = '<span class="crumb-item" onclick="loadDir(\'\')">🏠 Home (~)</span>';
            if (currentPath) {
                const parts = currentPath.split('/').filter(p => p.length > 0);
                let acc = '';
                parts.forEach((p, idx) => {
                    acc += (idx === 0 ? '' : '/') + p;
                    const pathParam = acc;
                    html += `<span class="crumb-sep">/</span><span class="crumb-item" onclick="loadDir('${pathParam}')">${escapeHtml(p)}</span>`;
                });
            }
            container.innerHTML = html;
        }

        function renderFiles(items) {
            const tbody = document.getElementById('fileTableBody');
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">This directory is empty.</td></tr>';
                return;
            }

            let html = '';
            // If inside a subfolder, show '..' back button
            if (currentPath) {
                const parentPath = currentPath.includes('/') ? currentPath.substring(0, currentPath.lastIndexOf('/')) : '';
                html += `
                    <tr>
                        <td>
                            <div class="file-name-cell dir" onclick="loadDir('${parentPath}')">
                                <span class="file-icon">📂</span>
                                <span>.. (Parent Directory)</span>
                            </div>
                        </td>
                        <td class="file-size">-</td>
                        <td class="file-time">-</td>
                        <td></td>
                    </tr>
                `;
            }

            items.forEach(item => {
                const icon = item.is_dir ? '📁' : getFileIcon(item.name);
                const clickAction = item.is_dir ? `loadDir('${item.relative_path}')` : `downloadFile('${item.relative_path}')`;
                const dateStr = item.modified ? new Date(item.modified).toLocaleString() : '-';

                html += `
                    <tr>
                        <td>
                            <div class="file-name-cell ${item.is_dir ? 'dir' : 'file'}" onclick="${clickAction}">
                                <span class="file-icon">${icon}</span>
                                <span>${escapeHtml(item.name)}</span>
                            </div>
                        </td>
                        <td class="file-size">${item.is_dir ? '-' : item.size_formatted}</td>
                        <td class="file-time">${dateStr}</td>
                        <td>
                            <div class="action-btns">
                                ${!item.is_dir ? `<a class="btn-icon" href="/api/files/download?path=${encodeURIComponent(item.relative_path)}" download>⬇️ Download</a>` : ''}
                                <button class="btn-icon btn-del" onclick="deleteItem('${item.relative_path}', '${escapeHtml(item.name)}')">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            if (['jpg','jpeg','png','gif','svg','webp'].includes(ext)) return '🖼️';
            if (['mp4','mkv','webm','mov'].includes(ext)) return '🎥';
            if (['mp3','wav','ogg','m4a'].includes(ext)) return '🎵';
            if (['zip','rar','tar','gz','7z'].includes(ext)) return '📦';
            if (['js','json','html','css','py','sh','php','sql'].includes(ext)) return '💻';
            if (['pdf','doc','docx','txt','md'].includes(ext)) return '📄';
            return '📄';
        }

        async function uploadSelectedFiles() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;

            const banner = document.getElementById('uploadBanner');
            const statusText = document.getElementById('uploadStatusText');
            banner.style.display = 'flex';
            statusText.innerText = `Uploading ${fileInput.files.length} file(s) to phone storage...`;

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }

            try {
                const res = await fetch('/api/files/upload?path=' + encodeURIComponent(currentPath), {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                if (result.success) {
                    statusText.innerText = 'Upload complete!';
                    setTimeout(() => { banner.style.display = 'none'; }, 2000);
                    fileInput.value = '';
                    loadDir(currentPath);
                } else {
                    alert('Upload failed: ' + result.error);
                    banner.style.display = 'none';
                }
            } catch (err) {
                alert('Upload network error: ' + err.message);
                banner.style.display = 'none';
            }
        }

        async function createFolder() {
            const name = prompt('Enter new folder name:');
            if (!name) return;
            try {
                const res = await fetch('/api/files/mkdir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_path: currentPath, folder_name: name })
                });
                const result = await res.json();
                if (result.success) {
                    loadDir(currentPath);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }

        async function deleteItem(path, name) {
            if (!confirm(`Are you sure you want to delete "${name}" from your phone?`)) return;
            try {
                const res = await fetch('/api/files/delete?path=' + encodeURIComponent(path), {
                    method: 'DELETE'
                });
                const result = await res.json();
                if (result.success) {
                    loadDir(currentPath);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }

        function downloadFile(path) {
            window.location.href = '/api/files/download?path=' + encodeURIComponent(path);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text || '';
            return div.innerHTML;
        }

        loadDir('');
    </script>
</body>
</html>
